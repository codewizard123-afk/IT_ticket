# Shared configuration (owner: ALL; changes go through a contract-change PR, README §8.3).
# Owner-specific files live next to this one: data/privacy/taxonomy_map (P1), ai/rules/signals (P2),
# backend/escalation/kb_escalation_clauses/clarify_templates/users (P3), ui (P4).
pipeline_version: "2.0.0"
api:
  base_path: /api/v1
  port: 8000
ui:
  port: 8501
paths:
  tickets: data/processed/tickets.json
  tickets_enriched: data/processed/tickets_enriched.json
  kb_articles: data/kb/articles.json
  kb_governed: data/kb/articles_governed.json
  samples: data/samples/sample_tickets.json
  seed_incidents: data/seed/resolved_incidents.json
  test_tickets: data/test/test_tickets.json
  chroma_dir: data/chroma
  app_db: data/app.db
  llm_cache: data/llm_cache.sqlite
  indexes_dir: indexes
  golden_dir: shared/fixtures/golden
embedding:
  model: BAAI/bge-small-en-v1.5
  normalize: true
