# P3 · E6: KEDB escalation criteria hand-mapped to signal predicates (architecture §8.2). Owner: P3.
#
# For the top-2 KB articles of an issue (score ≥ tau_show), every clause whose `when` holds adds an
# E6 reason "<kb_id>: <text>". All keys inside one `when` must hold (AND). Supported keys:
#   scope_in: [..]        Signals.scope is one of these
#   min_users: n          Signals.affected_users ≥ n
#   business_critical: true
#   security: true        Signals.security_flags non-empty or a secret was detected
#   environment_in: [..]  Signals.environment / ticket environment (lower-case)
#   change_trigger: true  Signals.change_trigger is set
#   text_any: [..]        any phrase occurs in the lower-cased (redacted) ticket text
#   text_all: [..]        every phrase occurs in it
# Phrases are deliberately specific: a clause should fire only when the ticket states the criterion.

_multi: &multi [multiple, team, site, org]
_wide: &wide [site, org]

