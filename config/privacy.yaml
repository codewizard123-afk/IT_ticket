# P1 · privacy redaction (privacy/redact.py, architecture §6.2). Owner: P1.
# Order matters: earlier types win when two matches overlap.
# Regexes are Python `re` syntax, compiled with IGNORECASE unless `case_sensitive: true`.

patterns:
  SECRET:
    # password=..., pwd: ..., Password=...; in connection strings. Only the value is replaced.
    - regex: '(?P<key>\b(?:password|passwd|pwd|passcode|secret|api[_-]?key)\b\s*[:=]\s*)(?P<value>"[^"]*"|''[^'']*''|[^\s;,]+)'
      value_group: value
  TOKEN:
    - regex: '\b(?:sk|gsk|pk|rk)[-_][A-Za-z0-9_\-]{16,}'
    - regex: '\bgh[pousr]_[A-Za-z0-9]{20,}'
    - regex: '\bAKIA[0-9A-Z]{16}\b'
    - regex: '(?P<key>\bBearer\s+)(?P<value>[A-Za-z0-9._~+/\-]{16,}=*)'
      value_group: value
    - regex: '\beyJ[A-Za-z0-9_\-]{8,}\.[A-Za-z0-9_\-]{8,}\.[A-Za-z0-9_\-]{8,}'   # JWT
    - regex: '\b[0-9a-fA-F]{32,}\b'                                            # long hex
    - regex: '(?<![A-Za-z0-9+/])(?=[A-Za-z0-9+/]*[0-9])(?=[A-Za-z0-9+/]*[A-Z])(?=[A-Za-z0-9+/]*[a-z])[A-Za-z0-9+/]{40,}={0,2}'  # long base64
      case_sensitive: true
  EMAIL:
    - regex: '\b[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}\b'
  IP:
    - regex: '(?<![\w.])(?:(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.){3}(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(?![\w.]*\d)'
    - regex: '(?<![\w:])(?:[0-9a-fA-F]{1,4}:){7}[0-9a-fA-F]{1,4}(?![\w:])'
    - regex: '(?<![\w:])(?=[0-9a-fA-F:]*::)(?:[0-9a-fA-F]{1,4}:){1,6}:(?:[0-9a-fA-F]{1,4}(?::[0-9a-fA-F]{1,4}){0,5})?(?![\w:])'
  PHONE:
    # +91 90000 20059, +1 (555) 123-4567, +44 20 7946 0958
    - regex: '(?<![\w+])\+\d{1,3}[\s.\-]?(?:\(\d{1,4}\)[\s.\-]?)?\d{2,5}(?:[\s.\-]?\d{2,5}){1,3}(?!\w)'
    # (555) 123-4567, 555-123-4567, 555.123.4567
    - regex: '(?<![\w(])\(?\d{3}\)?[\s.\-]\d{3}[\s.\-]\d{4}(?!\w)'
    # Indian mobile without country code: 9876543210 / 98765 43210 / 98765-43210
    - regex: '(?<![\w\-])[6-9]\d{4}[\s\-]?\d{5}(?![\w\-])'
  ID:
    - regex: '\b(?:EMP|EMPID|E)[\-_]?\d{5,8}\b'
    - regex: '\b(?:ASSET|AST|LT|PC|WS|SN)[\-_]\d{4,10}\b'
    - regex: '(?P<key>\b(?:employee|staff|badge|asset)\s*(?:id|no\.?|number|tag)\s*(?:is|:|#)?\s*)(?P<value>[A-Z0-9][A-Z0-9\-]{3,})'
      value_group: value
  PERSON:
    # Name after a trigger phrase. The trigger is case-insensitive; the name must be Capitalised.
    - regex: '(?P<key>\b(?i:my name is|i am|i''m|this is|contact|user:|reported by|regards,|thanks,)\s+)(?P<value>[A-Z][a-z]+(?:\s+[A-Z][a-z]+)?)'
      value_group: value
      case_sensitive: true
    - regex: '(?P<key>\b(?i:user|username|login)\s*[:=]\s*)(?P<value>[A-Za-z][\w.\-]{2,})'
      value_group: value
      case_sensitive: true

# Words that look like names after a trigger but are not ("I am Unable", "This is Outlook").
person_stopwords: [Unable, Not, Working, Getting, Using, On, In, At, The, A, An, Still, Also,
  Trying, Locked, Outlook, Teams, Windows, Excel, Word, Zoom, Webex, SAP, Oracle, Chrome, Monday,
  Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday, Today, Tomorrow, IT, Team, Hi, Hello,
  Unavailable, Available, Me, Him, Her, New, Back, Out, Away, From, Here, Sure, Urgent]

# Known names (whole word, Capitalised). First names alone, or "First Last".
names:
  first: [Aarav, Diya, Rohan, Priya, Karan, Ananya, Vikram, Neha, Arjun, Sara, Rahul, Meera, John,
    Emma, Ravi, Fatima, Alice, Bob, Carol, Dave]
  last: [Sharma, Iyer, Patel, Reddy, Nair, Gupta, Khan, Das, Smith, Fernandes, Menon, Joshi]

# False-positive guards: spans overlapping these are never redacted (error codes, IDs, dates…).
protected:
  - '\bORA-\d{5}\b'
  - '\b0x[0-9a-fA-F]{8}\b'
  - '\bSQL\s*Server\s+error\s+\d{3,5}\b'
  - '\bSQLSTATE\s+\w{5}\b'
  - '\bSQL\d{4,5}[NW]\b'
  - '\b(?:MSI\s+)?error\s+\d{1,5}\b'
  - '\bERROR\s+\d{3,5}\s*\(\w{5}\)'
  - '\bEvent\s+ID\s+\d{3,5}\b'
  - '\bHTTP\s+\d{3}\b'
  - '\b(?:KB|INC|TKT|DEMO|INC-H|T)-?\d{2,6}\b'
  - '\b\d{4}-\d{2}-\d{2}(?:[T\s]\d{2}:\d{2}(?::\d{2})?)?\b'
  - '\b\d{1,2}:\d{2}(?::\d{2})?\b'
  - '\b169\.254\.x\.x\b'
  - '\b\d{3}\s+\d\.\d\.\d\b'
