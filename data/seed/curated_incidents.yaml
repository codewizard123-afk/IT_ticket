  - category: Inquiry/Help
    subcategory: Antivirus
    priority: P4
    environment: remote
    application: Endpoint protection
    kb_ids: [KB-0059]
    title: Antivirus says Definitions out of date
    description: >-
      Endpoint protection shows Definitions out of date on my laptop. I mostly work from home.
    resolution: >-
      The laptop had not reached the update service off VPN. Connected to VPN and triggered a
      security intelligence update from the endpoint protection app; definitions were current
      and a quick scan was clean.
  - category: Inquiry/Help
    subcategory: Antivirus
    priority: P3
    environment: office
    application: Endpoint protection
    kb_ids: [KB-0059, KB-0028]
    title: Business macro file quarantined by antivirus
    description: >-
      Our team's macro workbook is quarantined every time I download it from SharePoint with
      Threat quarantined.
    resolution: >-
      Sent the file to the security team for analysis; it was confirmed clean and the security
      team added a scoped exclusion for the signed workbook hash. Protection stayed fully on and
      the file opened normally.
  - category: Inquiry/Help
    subcategory: Internal Application
    priority: P3
    environment: office
    application: Timesheet app
    kb_ids: [KB-0060]
    title: Timesheet app loops at sign-in - ERR_TOO_MANY_REDIRECTS
    description: >-
      The timesheet app keeps redirecting at sign-in and the browser shows
      ERR_TOO_MANY_REDIRECTS. Other internal apps work.
    resolution: >-
      Stale session cookies for the app's domain caused the loop. Cleared cookies for that site
      and signed in again; the app loaded. The app team was told about the cookie issue.
  - category: Inquiry/Help
    subcategory: Internal Application
    priority: P2
    environment: production
    application: Expense portal
    kb_ids: [KB-0060]
    title: Expense portal returns HTTP 500 for everyone
    description: >-
      The expense portal shows HTTP 500 Internal Server Error for everyone in Finance since this
      morning. Month-end submissions are due today.
    resolution: >-
      A failed deployment left the app pool stopped. The application support team rolled back to
      the previous release and restarted the app pool; the portal returned HTTP 200 and the
      incident was linked to the change record.
